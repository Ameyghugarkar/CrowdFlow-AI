[metadata]
name = CrowdFlow-AI
version = 1.0.0
description = A Real-Time Public Safety & Crowd Density Analytics Platform
author = Ameyghugarkar
license = MIT

[options]
packages = find:
python_requires = >=3.8

##############################################################################
# Nosetests Configuration
##############################################################################
[nosetests]
verbosity = 2
with-coverage = 1
cover-package = backend
cover-erase = 1
cover-html = 1
cover-html-dir = coverage_html_report
cover-min-percentage = 70

##############################################################################
# Coverage Configuration
##############################################################################
[coverage:run]
branch = True
source = backend
omit =
    */tests/*
    */test_*
    */__init__.py
    */venv/*
    */migrations/*

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 70
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    if self\.debug:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:

[coverage:html]
directory = coverage_html_report

[coverage:xml]
output = coverage.xml

##############################################################################
# Flake8 Configuration
##############################################################################
[flake8]
max-line-length = 100
max-complexity = 10
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    *.egg-info,
    migrations
ignore =
    E203,
    E266,
    E501,
    W503,
    W504
per-file-ignores =
    __init__.py: F401
    tests/*.py: S101

##############################################################################
# Pylint Configuration
##############################################################################
[pylint]
max-line-length = 100
disable =
    C0114,
    C0115,
    C0116,
    R0903,
    W0212
good-names = i, j, k, ex, Run, _, id, x, y
output-format = text
reports = yes
score = yes

[pylint.MESSAGES CONTROL]
confidence = HIGH

[pylint.FORMAT]
max-line-length = 100
indent-string = '    '

[pylint.DESIGN]
max-args = 7
max-attributes = 10
max-bool-expr = 5
max-branches = 12
max-locals = 15
max-returns = 6
max-statements = 50
